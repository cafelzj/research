name: Deploy research atlas to GitHub Pages

on:
  push:
    branches: [main, codex/sw31-atlas]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-sw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate 31-sector content and scripts
        run: node scripts/test_sw_atlas.cjs
      - name: Use preinstalled Chrome for reader checks
        run: |
          python3 -m pip install playwright
      - name: Exercise industry catalog and existing research
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/atlas-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 scripts/test_sw_atlas.py
          python3 scripts/test_industries.py
          python3 scripts/test_medicine.py
          python3 scripts/test_chemical_research.py http://127.0.0.1:8000/
  deploy:
    needs: validate-sw
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Python for indicator checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check indicator engine and retrieval boundaries
        run: |
          python3 -m pip install -r indicator_lab/requirements.txt
          python3 scripts/test_indicator_engine.py
          node scripts/test_indicator_search.cjs
          python3 scripts/build_indicator_guide.py --check
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp indicator-guide.html indicators.html index.html atlas.html data.html studio.html intelli.html daily.html washoku.html chinese-menu.html _site/
          cp -R assets _site/assets
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website matches this commit
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 scripts/verify_public_site.py "$SITE_URL"
      - name: Check public industry reader
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 -m pip install playwright
          python3 scripts/test_sw_atlas.py "$SITE_URL"
