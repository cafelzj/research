<svg xmlns="http://www.w3.org/2000/svg" width="420" height="480" viewBox="0 0 420 480" role="img" aria-labelledby="salon-title salon-desc">
  <title id="salon-title">宫廷记忆之章</title>
  <desc id="salon-desc">古金椭圆画框中的 GPU 芯片与分层高带宽内存，配以珍珠、星形珠宝与克制的维也纳花饰，采用原创科学版画式线描。</desc>
  <defs>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f2eadb"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#895360"/>
      <stop offset="1" stop-color="#713746"/>
    </linearGradient>
    <pattern id="engraving" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
      <path d="M0 0V5" fill="none" stroke="#b29053" stroke-width=".55" opacity=".35"/>
    </pattern>
    <g id="pearl" fill="#fffcf2" stroke="#b29053" stroke-width=".75">
      <circle r="2.35"/>
      <circle cx="-.55" cy="-.65" r=".55" fill="#fff" stroke="none"/>
    </g>
    <g id="star" stroke="#b29053" stroke-linejoin="round">
      <path d="m0-11 2.5 7.3L10-5 5.2 1l4.1 6.5-7.1-2L0 13-2.2 5.5l-7.1 2L-5.2 1-10-5l7.5 1.3Z" fill="#f8f0dc" stroke-width=".9"/>
      <path d="M0-7V8M-6-3l12 7M6-3-6 4" stroke-width=".55"/>
      <circle r="2.1" fill="#713746" stroke-width=".65"/>
    </g>
    <g id="sprig" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0C-13-30-18-63-8-97" stroke="#b29053" stroke-width="1.25"/>
      <path d="M-8-23C-25-24-29-35-27-42-15-42-7-33-8-23ZM-13-43C-1-48 4-58 1-65-11-62-16-53-13-43ZM-13-62C-29-65-30-76-27-83-16-80-11-73-13-62ZM-11-80C1-84 5-95 2-102-10-97-13-89-11-80ZM-8-97C-17-106-15-117-10-122-1-113-2-104-8-97Z" fill="#a6ad96" fill-opacity=".27" stroke="#929d86" stroke-width=".85"/>
      <path d="m-9-25-15-14m11-8 12-15m-13-4-10-14m14-3 9-15m-8-3-1-14" stroke="#b29053" stroke-width=".65"/>
    </g>
    <g id="hbm" stroke="#713746" stroke-linejoin="round" stroke-width=".95">
      <path d="m0 17 22 13 22-13v7L22 37 0 24Z" fill="#dccfba"/>
      <path d="m0 11 22 13 22-13v6L22 30 0 17Z" fill="#f5eddf"/>
      <path d="m0 5 22 13L44 5v6L22 24 0 11Z" fill="#dccfba"/>
