    <path d="M210 101v36m0 163v51M105 220h-8m226 0h-8M140 151l-6-7m146 7 6-7"/>
    <path d="M126 157a117 117 0 0 1 168 0M116 290a130 130 0 0 0 188 0" stroke-dasharray="2 5"/>
    <path d="M200 117h20m-16-4v8m12-8v8M200 335h20m-16-4v8m12-8v8"/>
