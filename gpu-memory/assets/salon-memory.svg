  <path d="M192 426q18 13 36 0m-32 6q14 10 28 0M210 440v7" fill="none" stroke="#b29053" stroke-width=".9"/>
  <path d="m210 447 4 6-4 8-4-8Z" fill="#713746" stroke="#b29053" stroke-width=".9"/>

  <!-- Restrained botanical flourishes stay outside the technical silhouette. -->
  <use href="#sprig" transform="translate(85 355) rotate(-8)"/>
  <use href="#sprig" transform="translate(335 355) scale(-1 1) rotate(-8)"/>
  <g fill="none" stroke="#b29053" stroke-width=".85" stroke-linecap="round">
    <path d="M81 259c-14-7-21-19-17-27 4-8 14-4 13 2-1 5-7 5-9 2m271 23c14-7 21-19 17-27-4-8-14-4-13 2 1 5 7 5 9 2"/>
    <path d="M100 365c-3 9 1 18 8 19 7 2 12-4 8-9-2-3-6-2-6 1m210-11c3 9-1 18-8 19-7 2-12-4-8-9 2-3 6-2 6 1"/>
  </g>

