  <g>
    <use href="#pearl" x="131" y="66"/><use href="#pearl" x="145" y="56"/><use href="#pearl" x="160" y="48"/>
    <use href="#pearl" x="289" y="66"/><use href="#pearl" x="275" y="56"/><use href="#pearl" x="260" y="48"/>
