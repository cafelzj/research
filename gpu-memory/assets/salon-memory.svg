  <path d="m108 221 102-60 102 60v15l-102 60-102-60Z" fill="#e7ddca" stroke="#713746" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="m108 221 102 60 102-60-102-60Z" fill="#faf5e9" stroke="#713746" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M210 281v15m-102-75 102 60 102-60" fill="none" stroke="#b29053" stroke-width="1"/>
  <path d="m116 225 94 55 94-55v7l-94 55-94-55Z" fill="url(#engraving)"/>
  <g fill="none" stroke="#b29053" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round">
    <path d="m145 240 29 17 16-9m-38-4 22 13 14-8m87-9-29 17-16-9m38-4-22 13-14-8"/>
    <path d="m170 185 15-9 17 10m48-1-15-9-17 10M190 264l20 11 20-11"/>
    <path d="m153 226 19 11 11-6m84-5-19 11-11-6"/>
  </g>
  <g fill="#b29053">
    <circle cx="145" cy="240" r="1.5"/><circle cx="275" cy="240" r="1.5"/>
    <circle cx="170" cy="185" r="1.5"/><circle cx="250" cy="185" r="1.5"/>
    <circle cx="190" cy="264" r="1.4"/><circle cx="230" cy="264" r="1.4"/>
  </g>
  <use href="#hbm" x="124" y="205"/>
  <use href="#hbm" x="252" y="205"/>

  <g stroke-linejoin="round">
    <path d="m169 207 41 24 41-24v16l-41 24-41-24Z" fill="#713746" stroke="#713746" stroke-width="1.1"/>
    <path d="m169 207 41-24 41 24-41 24Z" fill="url(#wine)" stroke="#713746" stroke-width="1.1"/>
    <path d="m177 207 33-19 33 19-33 19Z" fill="none" stroke="#dfc38e" stroke-width=".85"/>
    <path d="m185 207 25-14 25 14-25 14Z" fill="url(#engraving)" stroke="#c9a96d" stroke-width=".65"/>
    <g fill="none" stroke="#d5b77d" stroke-width=".7">
      <path d="m191 203 25 14m-18-18 25 14m-18-18 25 14m-39 2 25-14m-18 18 25-14m-18 18 25-14"/>
      <path d="m173 214 33 19m-33-14 33 19m8-5 33-19m-33 24 33-19M210 231v12"/>
    </g>
  </g>

  <!-- A quiet ribbon and jeweled rosette anchor the lower field. -->
  <g fill="none" stroke="#b29053" stroke-linecap="round">
    <path d="M147 320c18 8 39 12 63 12s45-4 63-12M157 326c16 7 34 10 53 10s37-3 53-10" stroke-width=".85"/>
    <path d="M137 350c13-8 27-6 39 0m68 0c12-6 26-8 39 0M148 354c10-4 19-2 27 2m70 0c8-4 17-6 27-2" stroke-width=".75"/>
