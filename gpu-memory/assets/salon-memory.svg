  <ellipse cx="210" cy="234" rx="144" ry="190" fill="none" stroke="#b29053" stroke-width=".55"/>
  <ellipse cx="210" cy="234" rx="136" ry="181" fill="none" stroke="#b29053" stroke-width=".7" stroke-dasharray=".8 4.5"/>
